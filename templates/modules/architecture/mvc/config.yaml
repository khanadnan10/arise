name: MVC
category: architecture
description: Model-View-Controller pattern with flat top-level structure.
version: 1.0.0
author: Arise

folders:
  - lib/controllers
  - lib/models
  - lib/views

  - lib/services
  - lib/routes

  - lib/core
  - lib/core/constants
  - lib/core/theme
  - lib/core/utils

  - lib/shared
  - lib/shared/widgets

packages: []

files:
  - from: files/main.dart
    to: lib/main.dart

  - from: files/app.dart
    to: lib/app.dart

requires: []
conflicts: []
