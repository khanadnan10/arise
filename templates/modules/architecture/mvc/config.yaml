name: MVC
category: architecture
description: Model-View-Controller pattern with flat top-level structure.
version: 1.0.0
author: Arise

folders:
  - lib/controllers
  - lib/models
  - lib/views
  - lib/services
  - lib/routes
  - lib/core
  - lib/core/constants
  - lib/core/theme
  - lib/core/utils
  - lib/shared
  - lib/shared/widgets

packages: []
requires: []
conflicts: []

variables:
  state_imports: ""
  state_setup: ""
  di_imports: ""
  di_setup: ""
  main_root: "const App()"
  app_imports: ""
  app_body: "MaterialApp(\n      debugShowCheckedModeBanner: false,\n      title: '{{app_name}}',\n      theme: ThemeData(colorSchemeSeed: Colors.blue, useMaterial3: true),\n      home: const Scaffold(body: Center(child: Text('Welcome to Arise 🚀'))),\n    )"
