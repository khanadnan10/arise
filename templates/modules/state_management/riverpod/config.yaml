name: Riverpod
category: state_management
description: Compile-safe reactive state management by Remi Rousselet.
version: 1.0.0
author: Arise

folders:
  - lib/core/state

packages:
  - name: flutter_riverpod

requires: []
conflicts:
  - provider
  - bloc
  - getx

variables:
  state_imports: "import 'package:flutter_riverpod/flutter_riverpod.dart';\n"
  main_root: "const ProviderScope(child: App())"
