name: Provider
category: state_management
description: Simple and flexible state management using InheritedWidget.
version: 1.0.0
author: Arise

folders:
  - lib/core/providers

packages:
  - name: provider

requires: []
conflicts:
  - riverpod
  - bloc
  - getx

variables:
  state_imports: "import 'core/providers/app_state.dart';\n"
  main_root: "withAppProviders(child: const App())"
