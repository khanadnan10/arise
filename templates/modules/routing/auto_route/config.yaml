name: AutoRoute
category: routing
description: Code-generated declarative routing with deep link support.
version: 1.0.0
author: Arise

folders:
  - lib/core/router

packages:
  - name: auto_route
    version: ^10.2.0

  - name: auto_route_generator
    version: ^10.2.0
    dev: true

  - name: build_runner
    dev: true

hooks:
  - phase: postPubGet
    command: dart
    args:
      - run
      - build_runner
      - build
      - --delete-conflicting-outputs

requires: []
conflicts:
  - go_router

variables:
  app_imports: "import 'core/router/app_router.dart';\n"
  app_body: "MaterialApp.router(\n      debugShowCheckedModeBanner: false,\n      title: '{{app_name}}',\n      theme: ThemeData(colorSchemeSeed: Colors.blue, useMaterial3: true),\n      routerConfig: appRouter.config(),\n    )"
